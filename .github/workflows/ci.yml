name: Build and validate candidate

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Check C++ formatting
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps clang-format==22.1.3
          if ($LASTEXITCODE) { throw 'clang-format installation failed.' }
          ./scripts/format.ps1 -Check
      - name: Test archive verification
        run: python -m unittest discover -s tests -p test_verify_candidate.py -v
      - name: Prepare pinned WDK tools
        run: |
          $wdk = ./scripts/prepare-ci-wdk.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'openzjs-wdk')
          "OPENZJS_WDK_ROOT=$wdk" | Add-Content $env:GITHUB_ENV
      - name: Build, test and validate unsigned candidate
        run: |
          ./scripts/package-candidate.ps1 -WdkRoot $env:OPENZJS_WDK_ROOT -OutputPathFile (Join-Path $env:RUNNER_TEMP 'candidate-path.txt')
          $candidate = Get-Content (Join-Path $env:RUNNER_TEMP 'candidate-path.txt')
          python ./scripts/verify-candidate.py $candidate --require-clean
          if ($LASTEXITCODE) { throw 'Archive verification failed.' }
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rc-*/validation/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve verified engineering archives
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rc-*/*.zip
            artifacts/rc-*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
